<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Framora check-in</title>
<style>
  body{font-family:Arial,sans-serif;text-align:center;padding:40px 16px;margin:0;color:#111;background:#fff}
  .title{font-size:40px;font-weight:700}
  .msg{font-size:20px;margin-top:16px;line-height:1.5}
  .ok{color:#16a34a}.bad{color:#dc2626}.warn{color:#d97706}.info{color:#111827}
  input{font-size:22px;padding:10px;width:180px;text-align:center;border:1px solid #ccc;border-radius:8px}
  button{font-size:18px;padding:10px 18px;margin-top:12px;border:0;border-radius:8px;background:#111;color:#fff}
  .link{margin-top:40px;font-size:14px;text-decoration:underline;background:none;color:#666}
  .hidden{display:none}
  /* Guest ticket view (Framora 360 brand) */
  body.ticket{background:#f7f6f2;padding:24px 16px}
  .tk{max-width:380px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(26,30,37,.12)}
  .tk-head{background:#1a1e25;color:#fff;padding:22px 18px 18px}
  .tk-brand{font:700 13px/1 Arial,sans-serif;letter-spacing:4px}
  .tk-brand b{color:#ffa732}
  .tk-event{font:700 22px/1.25 Arial,sans-serif;margin-top:14px}
  .tk-sub{font:600 11px/1 Arial,sans-serif;letter-spacing:3px;color:#ffa732;margin-top:8px}
  .tk-bar{height:5px;background:#ffa732}
  .tk-body{padding:22px 18px 26px;color:#1a1e25}
  .tk-qr{width:240px;height:240px;display:block;margin:0 auto}
  .tk-id{font:700 20px/1.3 Arial,sans-serif;letter-spacing:1px;margin-top:12px}
  .tk-who{font:15px/1.5 Arial,sans-serif;color:#6b7078;margin-top:4px}
  .tk-note{font:14px/1.5 Arial,sans-serif;margin-top:14px}
  .spin{width:54px;height:54px;border:6px solid #eee;border-top-color:#ffa732;border-radius:50%;margin:30px auto 18px;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="ticket" class="hidden"></div>
  <div id="result">
    <div class="title info" id="title"><div class="spin"></div></div>
    <div class="msg" id="msg"></div>
  </div>
  <div id="pinBox" class="hidden" style="margin-top:32px">
    <div class="msg">Staff PIN</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off"><br>
    <button onclick="savePin()">Save</button>
  </div>
  <button id="staffLink" class="link hidden" onclick="showPin()">Staff check-in</button>
<script>
  // The Apps Script web app (/exec). It answers JSON when called with api=1.
  var API = 'https://script.google.com/macros/s/AKfycbx-DAXAyesp4IFPSw5fgvVYjvp9w2qYevBbbadqAaGppzZGtjTt5h0di4TgXlvunjfU/exec';

  var q = new URLSearchParams(location.search);
  var T = (q.get('t') || '').trim().toUpperCase(), K = q.get('k') || '';
  var KEY = 'framoraStaffPin';
  function $(id){ return document.getElementById(id); }
  function getPin(){ try { return localStorage.getItem(KEY); } catch(e) { return null; } }
  function setPin(p){ try { p ? localStorage.setItem(KEY, p) : localStorage.removeItem(KEY); } catch(e) {} }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // A guest opening their own ticket link sees the ticket with its QR (the QR is this same page's link).
  function showTicket(r){
    document.body.className = 'ticket';
    $('result').className = 'hidden';
    var qr = 'https://quickchart.io/qr?size=480&margin=2&ecLevel=M&text=' + encodeURIComponent(location.href);
    $('ticket').className = '';
    $('ticket').innerHTML =
      '<div class="tk">' +
        '<div class="tk-head"><div class="tk-brand">FRAMOR<b>&#923;</b> 360</div>' +
        '<div class="tk-event">' + esc(r.event || 'Beauty Party on a Yacht') + '</div><div class="tk-sub">DUBAI</div></div>' +
        '<div class="tk-bar"></div>' +
        '<div class="tk-body">' +
          '<img class="tk-qr" alt="Ticket QR code" src="' + qr + '">' +
          '<div class="tk-id">' + esc(r.ticket) + '</div>' +
          '<div class="tk-who">' + esc(r.name) + (r.guest ? ' · Guest ' + esc(r.guest) : '') + '</div>' +
          '<div class="tk-note">Admits one guest. Show this QR code at boarding.</div>' +
        '</div>' +
      '</div>';
  }
  function show(r){
    $('title').className = 'title ' + (r.kind === 'pin' ? 'bad' : r.kind);
    $('title').innerHTML = r.title;      // server escapes guest names
    $('msg').innerHTML = r.message;
    if (r.kind === 'pin') { setPin(null); showPin(); }
  }
  function busy(){
    $('ticket').className = 'hidden';
    $('result').className = '';
    document.body.className = '';
    $('staffLink').className = 'link hidden';
    $('pinBox').className = 'hidden';
    $('title').className = 'title info';
    $('title').innerHTML = '<div class="spin"></div>';
    $('msg').textContent = 'Checking ticket…';
  }
  // No cookies are sent, so the user's Google accounts never matter.
  function call(params){
    var url = API + '?api=1';
    Object.keys(params).forEach(function(k){ if (params[k]) url += '&' + k + '=' + encodeURIComponent(params[k]); });
    return fetch(url, { credentials: 'omit', cache: 'no-store' })
      .then(function(res){ if (!res.ok) throw new Error('Server ' + res.status); return res.json(); })
      .catch(function(err){ return { kind: 'bad', title: 'Error', message: 'No connection. Try again.<br><small>' + String(err.message || err).replace(/</g,'&lt;') + '</small>' }; });
  }
  function run(pin){
    busy();
    call({ t: T, k: K, pin: pin }).then(show);
  }
  function showPin(){
    $('pinBox').className = '';
    $('staffLink').className = 'link hidden';
    $('pin').focus();
  }
  function savePin(){
    var p = $('pin').value.trim();
    if (!p) return;
    setPin(p);
    run(p);
  }
  $('pin').addEventListener('keydown', function(e){ if (e.key === 'Enter') savePin(); });

  var saved = getPin();
  if (saved) run(saved);
  else if (!T) { $('title').textContent = 'Check-in'; showPin(); }
  else {
    busy();
    call({ t: T, k: K }).then(function(r){
      if (r.kind === 'info' && r.ticket) showTicket(r); else show(r);
      if (r.kind === 'info') $('staffLink').className = 'link';
    });
  }
</script>
</body>
</html>
